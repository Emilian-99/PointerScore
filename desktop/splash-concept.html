<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PointerScore</title>
  <link rel="stylesheet" href="./splash-concept.css">
</head>
<body>
  <main class="concept-shell" aria-label="PointerScore wird gestartet">
    <section class="concept-card">
      <div class="packet-stage" aria-hidden="true">
        <div class="drop-path"></div>
        <span class="drop-point carrier-one"><i class="data-pack"></i></span>
        <span class="drop-point carrier-two"><i class="data-pack"></i></span>
        <span class="drop-point carrier-three"><i class="data-pack"></i></span>
        <span class="drop-point carrier-four"><i class="data-pack"></i></span>
        <span class="drop-point carrier-five"><i class="data-pack"></i></span>
        <span class="drop-point carrier-six"><i class="data-pack"></i></span>
        <span class="fall-balloon fall-one"></span>
        <span class="fall-balloon fall-two"></span>
        <span class="fall-balloon fall-three"></span>
        <span class="fall-balloon fall-four"></span>
        <span class="fall-balloon fall-five"></span>
        <span class="fall-balloon fall-six"></span>

        <div class="logo-target">
          <div class="water-fill"><span></span></div>
          <div class="water-splash splash-one"></div>
          <div class="water-splash splash-two"></div>
          <div class="water-splash splash-three"></div>
          <div class="water-splash splash-four"></div>
          <div class="water-splash splash-five"></div>
          <div class="water-splash splash-six"></div>
          <div class="logo-burst"></div>
          <img src="./pointerscore-logo.png" alt="">
        </div>
      </div>

      <div class="concept-copy">
        <p>PointerScore</p>
        <span>Analysebereich wird vorbereitet</span>
      </div>
    </section>
  </main>
</body>
</html>
