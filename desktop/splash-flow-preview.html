<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PointerScore Startvorschau</title>
  <style>
    :root {
      color-scheme: light;
      background: #000;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .app-frame {
      z-index: 1;
      background: #eef8ff;
    }

    .splash-frame {
      z-index: 3;
      background: #000;
      opacity: 1;
    }

    .reveal-layer {
      position: fixed;
      inset: 0;
      z-index: 2;
      background: #000;
      opacity: 1;
      pointer-events: none;
      transition: opacity 2s cubic-bezier(.22, .8, .25, 1);
    }

    .reveal-layer.is-visible {
      opacity: 0;
    }
  </style>
</head>
<body>
  <iframe class="app-frame" src="../dashboard.html?preview=1&desktopPreview=1" title="PointerScore Dashboard Vorschau"></iframe>
  <div class="reveal-layer" aria-hidden="true"></div>
  <iframe class="splash-frame" src="./splash-concept-random.html?flow=1" title="PointerScore Startanimation"></iframe>

  <script>
    const splashFrame = document.querySelector(".splash-frame");
    const revealLayer = document.querySelector(".reveal-layer");
    const splashDuration = 13100;
    const revealFade = 2000;

    window.setTimeout(() => {
      splashFrame.remove();
      requestAnimationFrame(() => {
        revealLayer.classList.add("is-visible");
      });
      window.setTimeout(() => {
        revealLayer.remove();
      }, revealFade + 140);
    }, splashDuration);
  </script>
</body>
</html>
