<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PointerScore</title>
  <link rel="stylesheet" href="./splash.css">
</head>
<body>
  <main class="splash-shell" aria-label="PointerScore wird gestartet">
    <section class="splash-card">
      <div class="logo-orbit" aria-hidden="true">
        <div class="logo-glow"></div>
        <img src="./pointerscore-logo.png" alt="">
      </div>

      <div class="wordmark">
        <p>PointerScore</p>
        <span>Dein Analysebereich wird vorbereitet</span>
      </div>

      <div class="splash-loader" role="status" aria-label="PointerScore lädt">
        <span aria-hidden="true"></span>
      </div>

      <div class="loading-row" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
    </section>
  </main>
</body>
</html>
