<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PointerScore</title>
  <link rel="stylesheet" href="./splash.css">
</head>
<body>
  <main class="splash-shell" aria-label="PointerScore wird gestartet">
    <section class="splash-card">
      <div class="logo-orbit" aria-hidden="true">
        <div class="logo-glow"></div>
        <img src="./icon.ico" alt="">
      </div>

      <div class="wordmark">
        <p>PointerScore</p>
        <span>Dein Analysebereich wird vorbereitet</span>
      </div>

      <svg class="market-line" viewBox="0 0 520 130" role="img" aria-label="PointerScore Startanimation">
        <defs>
          <linearGradient id="lineGradient" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0%" stop-color="#3a8df4" stop-opacity="0"/>
            <stop offset="35%" stop-color="#3a8df4"/>
            <stop offset="100%" stop-color="#79bdff"/>
          </linearGradient>
          <filter id="lineGlow">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <path class="track" d="M20 100 L105 86 L168 94 L236 62 L292 72 L365 36 L445 49 L500 18"/>
        <path class="pulse-line" d="M20 100 L105 86 L168 94 L236 62 L292 72 L365 36 L445 49 L500 18"/>
        <g class="arrow-head">
          <path d="M0 0 L19 8 L4 20 L7 10 Z"/>
        </g>
      </svg>

      <div class="loading-row" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
    </section>
  </main>
</body>
</html>
