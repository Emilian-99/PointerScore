<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PointerScore</title>
  <link rel="stylesheet" href="./splash-concept-rain.css">
</head>
<body>
  <main class="concept-shell" aria-label="PointerScore wird gestartet">
    <section class="concept-card">
      <div class="packet-stage rain-stage" aria-hidden="true">
        <div class="rain-cloud">
          <span class="cloud-bump cloud-bump-one"></span>
          <span class="cloud-bump cloud-bump-two"></span>
          <span class="cloud-bump cloud-bump-three"></span>
          <span class="cloud-face">
            <i class="eye eye-left"></i>
            <i class="eye eye-right"></i>
            <i class="mouth"></i>
          </span>
        </div>

        <div class="rain-stream">
          <span class="drop drop-one"></span>
          <span class="drop drop-two"></span>
          <span class="drop drop-three"></span>
          <span class="drop drop-four"></span>
          <span class="drop drop-five"></span>
          <span class="drop drop-six"></span>
          <span class="drop drop-seven"></span>
          <span class="drop drop-eight"></span>
          <span class="drop drop-nine"></span>
          <span class="drop drop-ten"></span>
          <span class="drop drop-eleven"></span>
          <span class="drop drop-twelve"></span>
          <span class="drop drop-thirteen"></span>
          <span class="drop drop-fourteen"></span>
          <span class="drop drop-fifteen"></span>
          <span class="drop drop-sixteen"></span>
          <span class="drop drop-seventeen"></span>
          <span class="drop drop-eighteen"></span>
          <span class="drop drop-nineteen"></span>
          <span class="drop drop-twenty"></span>
        </div>

        <div class="logo-target">
          <div class="rain-fill"><span></span></div>
          <div class="rain-mist"></div>
          <div class="logo-burst"></div>
          <img src="./icon.ico" alt="">
        </div>
      </div>

      <div class="concept-copy">
        <p>PointerScore</p>
        <span>Analysebereich wird vorbereitet</span>
      </div>
    </section>
  </main>
</body>
</html>
