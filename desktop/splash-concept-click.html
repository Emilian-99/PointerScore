<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PointerScore</title>
  <link rel="stylesheet" href="./splash-concept-click.css">
</head>
<body>
  <main class="concept-shell" aria-label="PointerScore wird gestartet">
    <section class="concept-card">
      <div class="packet-stage click-stage" aria-hidden="true">
        <div class="click-focus"></div>

        <div class="logo-target">
          <div class="click-fill"></div>
          <div class="click-glow"></div>
          <div class="logo-burst"></div>
          <img src="./icon.ico" alt="">
        </div>

        <div class="cursor-wrap">
          <img class="mouse-cursor" src="./cursor-white-filled.svg" alt="">
        </div>
      </div>

      <div class="concept-copy">
        <p>PointerScore</p>
        <span>Analysebereich wird vorbereitet</span>
      </div>
    </section>
  </main>
</body>
</html>
