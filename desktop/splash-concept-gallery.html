<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PointerScore Animationstest</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #061b35;
      background: #eef8ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      grid-template-rows: auto 1fr;
      background:
        radial-gradient(circle at 50% 28%, rgba(73, 158, 243, .18), transparent 34%),
        linear-gradient(145deg, #f7fcff 0%, #eef8ff 50%, #e6f3ff 100%);
    }

    .gallery-bar {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      padding: 16px;
      border-bottom: 1px solid rgba(191, 217, 238, .9);
      background: rgba(255, 255, 255, .78);
      box-shadow: 0 16px 36px rgba(18, 64, 104, .08);
    }

    button {
      appearance: none;
      border: 1px solid rgba(120, 176, 225, .8);
      border-radius: 999px;
      background: #fff;
      color: #0a315f;
      padding: 10px 14px;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }

    button:hover,
    button.is-active {
      background: #2f8ff0;
      color: #fff;
      box-shadow: 0 12px 26px rgba(47, 143, 240, .22);
      transform: translateY(-1px);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <nav class="gallery-bar" aria-label="PointerScore Animationen testen">
    <button class="is-active" data-url="./splash-concept-fill.html">6. Standard 50%</button>
    <button data-url="./splash-concept.html">1. Päckchen</button>
    <button data-url="./splash-concept-lightning.html">2. Blitz</button>
    <button data-url="./splash-concept-rain.html">3. Wolke</button>
    <button data-url="./splash-concept-click.html">4. Cursor</button>
    <button data-url="./splash-concept-breathe.html">5. Strahlen</button>
    <button data-url="./splash-concept-random.html">Random echt</button>
  </nav>

  <iframe id="preview" src="./splash-concept-fill.html?v=gallery-start" title="PointerScore Animation Vorschau"></iframe>

  <script>
    const preview = document.querySelector("#preview");
    const buttons = document.querySelectorAll("button[data-url]");

    buttons.forEach((button) => {
      button.addEventListener("click", () => {
        buttons.forEach((item) => item.classList.remove("is-active"));
        button.classList.add("is-active");
        preview.src = `${button.dataset.url}?v=${Date.now().toString(36)}`;
      });
    });
  </script>
</body>
</html>
