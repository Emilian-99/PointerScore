name: Prepare standalone desktop transition and information website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run check
      - run: npm run desktop:prepare
      - run: npm run test:transition
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    # Do not remove the web renderer until the bundled desktop update is actually released.
    if: ${{ vars.POINTERSCORE_BUNDLED_DESKTOP_RELEASED == '1.0.10' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified output only
        id: deployment
        uses: actions/deploy-pages@v4
